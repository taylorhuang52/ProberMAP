<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prober MAP Editor v4.0 (支援匯入/匯出機台格式)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #00d4ff;
            --border-color: #45475a;
            --pass-color: #00e676;
            --fail-color: #ff1744;
            --skip-color: #11111b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
        }
        .panel {
            width: 320px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .canvas-container {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        canvas {
            border: 2px solid var(--border-color);
            background-color: #11111b;
            cursor: pointer;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 0.9rem; color: #a6adc8; font-weight: bold; }
        select, input, button {
            background-color: #1e1e2e;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        button {
            background-color: var(--accent-color);
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background-color: #00b4d8; }
        button.btn-import {
            background-color: #a855f7;
            color: #fff;
        }
        button.btn-import:hover { background-color: #9333ea; }
        button.btn-danger {
            background-color: #ff1744;
            color: #fff;
        }
        button.btn-danger:hover { background-color: #d50000; }
        .section-title {
            font-size: 0.78rem;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 2px;
        }
        .info-box {
            background-color: #11111b;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.82rem;
            white-space: pre-wrap;
            flex: 1;
            min-height: 80px;
        }
        .radio-tile-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 7px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #1e1e2e;
            font-size: 0.88rem;
        }
        .radio-label:hover { border-color: var(--accent-color); }
        .radio-label input { margin: 0; cursor: pointer; }
        .color-indicator {
            width: 14px; height: 14px;
            border-radius: 2px;
            display: inline-block;
            border: 1px solid #fff;
        }
        #statusText {
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
        }
        #importFileInput { display: none; }
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            font-size: 0.82rem;
            color: #a6adc8;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #a855f7;
            background: rgba(168,85,247,0.08);
        }
    </style>
</head>
<body>

<header>
    <h1>Prober MAP Editor v4.0 (匯入/匯出機台格式)</h1>
    <div id="statusText">系統就緒</div>
</header>

<div class="main-container">
    <div class="panel">

        <!-- ── 機台設定 ── -->
        <div class="section-title">機台設定</div>

        <div class="form-group">
            <label>探針台型號 (Model Type)</label>
            <select id="modelType" onchange="changeModel()">
                <option value="UF2000_ULLD">UF2000 / ULLD (51,968 bytes)</option>
                <option value="UF200_LLD">UF200 / M-LLD (38,400 bytes)</option>
            </select>
        </div>

        <div class="form-group">
            <label>平邊角度 (Flat Angle)</label>
            <input type="number" id="flatAngle" value="180" min="0" max="270" step="90" onchange="changeAngle()">
        </div>

        <!-- ── 編輯模式 ── -->
        <div class="section-title">點擊編輯模式</div>

        <div class="radio-tile-group">
            <label class="radio-label">
                <input type="radio" name="editMode" value="pass" checked>
                <span class="color-indicator" style="background-color: var(--pass-color);"></span>
                <span>🟩 良品 / 要測試 (0x40)</span>
            </label>
            <label class="radio-label">
                <input type="radio" name="editMode" value="fail">
                <span class="color-indicator" style="background-color: var(--fail-color);"></span>
                <span>🟥 不良品 / 要測試 (0x01)</span>
            </label>
            <label class="radio-label">
                <input type="radio" name="editMode" value="skip">
                <span class="color-indicator" style="background-color: #2d3142; border-color: #546e8a;"></span>
                <span>⬛ 不測試 Skip (0x00)</span>
            </label>
        </div>

        <!-- ── 匯入 ── -->
        <div class="section-title">匯入機台資料</div>

        <div class="drop-zone" id="dropZone" onclick="document.getElementById('importFileInput').click()">
            📂 拖曳或點擊選取機台 .zip 檔案<br>
            <small style="color:#666">(含 dieData.dat 的 zip 包)</small>
        </div>
        <input type="file" id="importFileInput" accept=".zip" onchange="importZip(this.files[0])">

        <!-- ── 操作按鈕 ── -->
        <div class="section-title">操作</div>

        <button onclick="resetMap()">重設地圖 (Reset Map)</button>
        <button onclick="exportProductZip()">⬇ 匯出機台格式 zip</button>

        <!-- ── 統計 ── -->
        <div class="section-title">系統狀態與統計</div>
        <div id="infoBox" class="info-box"></div>

    </div>

    <div class="canvas-container">
        <canvas id="mapCanvas" width="448" height="448"></canvas>
    </div>
</div>

<script>
// ── 機台 Profile ─────────────────────────────────────────
const PROFILES = {
    UF200_LLD:   { dataSize: 38400, videoSize: 38400, camFlag: 0x02, paddingByte: 0x50, passCode: 0x50 },
    UF2000_ULLD: { dataSize: 51968, videoSize: 51968, camFlag: 0x04, paddingByte: 0x50, passCode: 0x40 }
};

// ── 機台 dieData.dat 格式常數 ─────────────────────────────
// 稀疏格式: [0x00, row, status, col]
// Status codes: 0x40=ULLD pass, 0x50=M-LLD pass, 0x02=edge ring, 0x80=ULLD inner edge, 0x00=skip
const MACHINE_PASS_ULLD = 0x40;
const MACHINE_PASS_LLD  = 0x50;
const MACHINE_EDGE      = 0x02;
const MACHINE_EDGE2     = 0x80;

// 機台座標偏移預設值（若匯入則從 footer 覆寫）
const COORD_OFFSET = {
    UF2000_ULLD: { rMin: 3, cMin: 5, rMax: 34, cMax: 31 },
    UF200_LLD:   { rMin: 4, cMin: 4, rMax: 35, cMax: 35 }
};

// ── devParm.dat Schema（修正版）────────────────────────────
// 兩種機台的 FlatAngle 實際都在 offset 30
const PARAM_SCHEMA = {
    UF200_LLD: [
        { id: 1, name: "DieRowSize",  type: "uint32", offset: 12, default: 4500 },
        { id: 2, name: "DieColSize",  type: "uint32", offset: 16, default: 4500 },
        { id: 3, name: "FlatAngle",   type: "uint16", offset: 30, default: 180  },
        { id: 4, name: "PassBinCode", type: "uint8",  offset: 32, default: 80   },  // M-LLD: 0x50=80
        { id: 5, name: "FailBinCode", type: "uint8",  offset: 33, default: 1    }
    ],
    UF2000_ULLD: [
        { id: 1, name: "DieRowSize",  type: "uint32", offset: 24, default: 4500 },
        { id: 2, name: "DieColSize",  type: "uint32", offset: 28, default: 4500 },
        { id: 3, name: "FlatAngle",   type: "uint16", offset: 30, default: 180  },  // 修正: 30 不是 42
        { id: 4, name: "PassBinCode", type: "uint8",  offset: 44, default: 64   },  // ULLD: 0x40=64
        { id: 5, name: "FailBinCode", type: "uint8",  offset: 45, default: 1    }
    ]
};

// ── 核心狀態 ─────────────────────────────────────────────
let config = { modelType: 'UF2000_ULLD', rows: 32, cols: 32, flatAngle: 180 };
// 機台座標（匯入時從 footer 讀取，匯出時原樣寫回）
let machineCoord = { ...COORD_OFFSET['UF2000_ULLD'] };
let mapGrid = [];
const cellSize = 14;
const canvas  = document.getElementById('mapCanvas');
const ctx     = canvas.getContext('2d');

// ── 晶圓初始化 (6吋圓形) ────────────────────────────────
function initMapGrid() {
    mapGrid = [];
    const Cx = (config.cols - 1) / 2;
    const Cy = (config.rows - 1) / 2;
    const r_wafer = 15.2;
    const edge_thickness = 1.2;

    for (let r = 0; r < config.rows; r++) {
        let rowData = [];
        for (let c = 0; c < config.cols; c++) {
            let dist = Math.sqrt(Math.pow(c - Cx, 2) + Math.pow(r - Cy, 2));
            rowData.push({
                status: dist <= (r_wafer - edge_thickness) ? 'active' : 'skip',
                fail: false
            });
        }
        mapGrid.push(rowData);
    }
}

// ── 畫布繪製 ─────────────────────────────────────────────
function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < config.rows; r++) {
        for (let c = 0; c < config.cols; c++) {
            let cell = mapGrid[r][c];
            if (cell.status === 'skip') {
                ctx.fillStyle = '#11111b';
            } else {
                ctx.fillStyle = cell.fail ? 'rgba(255,23,68,0.9)' : 'rgba(0,230,118,0.9)';
            }
            ctx.fillRect(c * cellSize, r * cellSize, cellSize - 1, cellSize - 1);
        }
    }
}

// ── 滑鼠點擊 ─────────────────────────────────────────────
canvas.addEventListener('click', function(e) {
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / cellSize);
    const r = Math.floor((e.clientY - rect.top)  / cellSize);

    if (r >= 0 && r < config.rows && c >= 0 && c < config.cols) {
        const mode = document.querySelector('input[name="editMode"]:checked').value;
        let cell = mapGrid[r][c];
        if (mode === 'skip') {
            cell.status = 'skip'; cell.fail = false;
        } else if (mode === 'fail') {
            cell.status = 'active'; cell.fail = true;
        } else {
            cell.status = 'active'; cell.fail = false;
        }
        drawMap();
        updateInfoBox();
    }
});

// ── UI 連動 ──────────────────────────────────────────────
function changeModel() {
    config.modelType = document.getElementById('modelType').value;
    machineCoord = { ...COORD_OFFSET[config.modelType] };
    updateInfoBox();
}
function changeAngle() {
    config.flatAngle = parseInt(document.getElementById('flatAngle').value) || 0;
    updateInfoBox();
}
function resetMap() {
    initMapGrid();
    drawMap();
    updateInfoBox();
    setStatus('地圖已重設');
}
function setStatus(msg) {
    document.getElementById('statusText').innerText = msg;
}

function updateInfoBox() {
    let pass = 0, fail = 0, skip = 0;
    mapGrid.forEach(row => row.forEach(cell => {
        if (cell.status === 'active') { cell.fail ? fail++ : pass++; }
        else skip++;
    }));
    document.getElementById('infoBox').innerText =
        `【配置】\n機台: ${config.modelType}\n` +
        `矩陣: ${config.rows} × ${config.cols}\n` +
        `平邊: ${config.flatAngle}°\n\n` +
        `【統計】\n★ 測試中 (Active): ${pass + fail}\n` +
        `  └ 良品 Pass (0x40): ${pass}\n` +
        `  └ 不良 Fail (0x01): ${fail}\n` +
        `★ 不測試 Skip: ${skip}`;
}

// ── Checksum (16-bit 補碼) ───────────────────────────────
function applyChecksum(buf) {
    let dv  = new DataView(buf.buffer);
    let sum = 0;
    for (let i = 0; i < buf.length - 2; i++) sum += buf[i];
    dv.setUint16(buf.length - 2, (0x10000 - (sum & 0xFFFF)) & 0xFFFF, false);
}

// ────────────────────────────────────────────────────────
//  匯出：buildDieData  → 機台稀疏格式
// ────────────────────────────────────────────────────────
function buildDieData() {
    const profile  = PROFILES[config.modelType];
    const mc       = machineCoord;          // ← 使用匯入時記住的座標（或預設值）
    const passCode = profile.passCode;

    const records = [];

    // ── 正常 die 記錄 ────────────────────────────────
    for (let r = 0; r < config.rows; r++) {
        for (let c = 0; c < config.cols; c++) {
            const cell    = mapGrid[r][c];
            const machRow = r + mc.rMin;
            const machCol = c + mc.cMin;
            let statusByte;
            if (cell.status === 'skip') {
                statusByte = MACHINE_EDGE;   // 0x02 = edge/skip
            } else {
                statusByte = cell.fail ? 0x01 : passCode;
            }
            records.push(0x00, machRow, statusByte, machCol);
        }
    }

    // ── 後設資料記錄 ─────────────────────────────────
    records.push(0x00, 0x02, 0x00, config.flatAngle & 0xFF);
    records.push(0x00, config.flatAngle & 0xFF, 0x00, config.flatAngle & 0xFF);
    records.push(0x00, 0x47, 0xB7, 0x60);

    // ── Footer (15 固定 records = 60 bytes) ──────────
    const footer = [
        0xFF, 0xFD, 0xFF, 0xFD,
        0x00, 0x00, 0x00, 0x80,
        0x00, 0x80, 0x00, 0x00,
        0x00, 0x00, 0x00, 0x01,
        0x00, 0x00, 0x00, 0x14,
        0x00, 0x14, 0x00, 0x00,
        0xFF, 0xFF, 0x00, 0x00,
        0xFF, 0xFF, 0x00, 0x00,
        0x00, 0x14, 0x00, 0x14,
        0x00, 0x00, 0x00, 0x01,
        0x00, mc.rMin, 0x00, mc.cMin,   // ← 匯入時的實際值
        0x00, mc.rMax, 0x00, mc.cMax,   // ← 匯入時的實際值
        0x00, 0x00, 0x00, 0x00,
        0x00, 0x00, 0x00, 0x00,
        0x00, 0x00, 0x00, 0x00
    ];

    const buf = new Uint8Array(records.length + footer.length);
    buf.set(records, 0);
    buf.set(footer, records.length);
    return buf;
}

// ────────────────────────────────────────────────────────
//  匯出：buildDevParm（修正版）
// ────────────────────────────────────────────────────────
function buildDevParm() {
    const profile = PROFILES[config.modelType];
    const buf = new Uint8Array(profile.dataSize);
    const dv  = new DataView(buf.buffer);
    const schema = PARAM_SCHEMA[config.modelType];

    // 前 8 bytes fill 0x11（保留標頭，機台型號由機台本身維護）
    buf.fill(0x11, 0, 8);

    schema.forEach(p => {
        let val = p.default;
        if (p.name === 'FlatAngle')   val = config.flatAngle;
        if (p.name === 'PassBinCode') val = profile.passCode;

        if      (p.type === 'uint32') dv.setUint32(p.offset, val, false);
        else if (p.type === 'uint16') dv.setUint16(p.offset, val, false);
        else                          dv.setUint8 (p.offset, val);
    });

    applyChecksum(buf);
    return buf;
}

// ────────────────────────────────────────────────────────
//  匯出：buildDevList（不變）
// ────────────────────────────────────────────────────────
function buildDevList() {
    const profile = PROFILES[config.modelType];
    const buf = new Uint8Array(profile.dataSize);
    const dv  = new DataView(buf.buffer);
    const schema = PARAM_SCHEMA[config.modelType];

    schema.forEach((p, idx) => {
        let off = 12 + idx * 32;
        if (off + 32 > buf.length - 2) return;
        dv.setUint32(off,     p.id,     false);
        dv.setUint32(off + 4, p.offset, false);
        let tc = (p.type === 'uint32') ? 0x04 : (p.type === 'uint16' ? 0x02 : 0x01);
        dv.setUint8(off + 8, tc);
    });

    applyChecksum(buf);
    return buf;
}

// ────────────────────────────────────────────────────────
//  匯出：buildGenericData (videoData / opParm)
// ────────────────────────────────────────────────────────
function buildGenericData(fillByte) {
    const profile = PROFILES[config.modelType];
    const buf = new Uint8Array(profile.dataSize);
    buf[0] = 0x33; buf[1] = 0x2E; buf[2] = 0x30; buf[3] = 0x30;
    buf[11] = profile.camFlag;
    buf.fill(fillByte, 12, buf.length - 2);
    applyChecksum(buf);
    return buf;
}

// ────────────────────────────────────────────────────────
//  匯入：從機台 zip 讀取 dieData.dat
// ────────────────────────────────────────────────────────
function importZip(file) {
    if (!file) return;
    setStatus('正在讀取 zip…');

    JSZip.loadAsync(file).then(zip => {
        const dieFile = zip.file('dieData.dat');
        if (!dieFile) {
            setStatus('❌ zip 內找不到 dieData.dat');
            return;
        }

        // 同時嘗試讀取 devParm.dat（可選）
        const parmFile = zip.file('devParm.dat');

        const promises = [
            dieFile.async('uint8array'),
            parmFile ? parmFile.async('uint8array') : Promise.resolve(null)
        ];

        Promise.all(promises).then(([dieBytes, parmBytes]) => {
            try {
                importDieData(dieBytes, parmBytes);
                setStatus('✅ 匯入成功！');
            } catch(e) {
                setStatus('❌ 匯入失敗: ' + e.message);
            }
        });
    }).catch(e => {
        setStatus('❌ 無法開啟 zip: ' + e.message);
    });
}

// ────────────────────────────────────────────────────────
//  匯入核心：解析機台 dieData.dat 稀疏格式
// ────────────────────────────────────────────────────────
function importDieData(bytes, parmBytes) {
    const sz = bytes.length;
    if (sz < 16) throw new Error('dieData.dat 過小');

    // ── 1. 自動偵測機台型號 ──────────────────────────
    let detectedModel = config.modelType;
    if (parmBytes && parmBytes.length >= 16) {
        let modelStr = '';
        for (let i = 0; i < 16; i++) {
            const ch = parmBytes[i];
            if (ch >= 0x20 && ch < 0x7F) modelStr += String.fromCharCode(ch);
        }
        modelStr = modelStr.trim();
        if (modelStr.includes('ULLD') || modelStr.includes('UF2')) {
            detectedModel = 'UF2000_ULLD';
        } else if (modelStr.includes('LLD') || modelStr.includes('M-L')) {
            detectedModel = 'UF200_LLD';
        }
        document.getElementById('modelType').value = detectedModel;
        config.modelType = detectedModel;
    }

    // ── 2. 從 devParm.dat 讀取 FlatAngle ────────────
    if (parmBytes) {
        const dv = new DataView(parmBytes.buffer, parmBytes.byteOffset, parmBytes.byteLength);
        const angle = dv.getUint16(30, false);
        if (angle === 0 || angle === 90 || angle === 180 || angle === 270) {
            config.flatAngle = angle;
            document.getElementById('flatAngle').value = angle;
        }
    }

    // ── 3. 找 footer 起始位置 ([FF FD FF FD]) ────────
    let footerIdx = sz;
    for (let i = 0; i < sz - 3; i += 4) {
        if (bytes[i] === 0xFF && bytes[i+1] === 0xFD &&
            bytes[i+2] === 0xFF && bytes[i+3] === 0xFD) {
            footerIdx = i;
            break;
        }
    }

    // ── 4. 從 footer 讀取 rMin/cMin/rMax/cMax ────────
    // footer 結構: 60 bytes (15 records × 4 bytes)
    // offset +40: [00, rMin, 00, cMin]
    // offset +44: [00, rMax, 00, cMax]
    let rMin, cMin, rMax, cMax;
    if (footerIdx + 48 <= sz) {
        rMin = bytes[footerIdx + 41];
        cMin = bytes[footerIdx + 43];
        rMax = bytes[footerIdx + 45];
        cMax = bytes[footerIdx + 47];
    } else {
        // footer 不完整，使用預設值
        const def = COORD_OFFSET[detectedModel];
        rMin = def.rMin; cMin = def.cMin;
        rMax = def.rMax; cMax = def.cMax;
    }

    // 記住機台座標，匯出時原樣寫回
    machineCoord = { rMin, cMin, rMax, cMax };

    // ── 5. 清空 grid ─────────────────────────────────
    mapGrid = [];
    for (let r = 0; r < config.rows; r++) {
        let row = [];
        for (let c = 0; c < config.cols; c++) {
            row.push({ status: 'skip', fail: false });
        }
        mapGrid.push(row);
    }

    // ── 6. 解析稀疏記錄 ──────────────────────────────
    let importedPass = 0, importedFail = 0, importedEdge = 0, outOfRange = 0;

    for (let i = 0; i < footerIdx; i += 4) {
        if (bytes[i] !== 0x00) continue;
        const machRow = bytes[i + 1];
        const statusB = bytes[i + 2];
        const machCol = bytes[i + 3];

        if (machRow < rMin || machRow > rMin + config.rows - 1) continue;
        if (machCol < cMin || machCol > cMin + config.cols - 1) continue;

        const gridR = machRow - rMin;
        const gridC = machCol - cMin;

        if (gridR < 0 || gridR >= config.rows || gridC < 0 || gridC >= config.cols) {
            outOfRange++;
            continue;
        }

        const cell = mapGrid[gridR][gridC];

        if (statusB === 0x40 || statusB === 0x50) {
            cell.status = 'active'; cell.fail = false;
            importedPass++;
        } else if (statusB === 0x01) {
            cell.status = 'active'; cell.fail = true;
            importedFail++;
        } else if (statusB === 0x02 || statusB === 0x80) {
            cell.status = 'skip';
            importedEdge++;
        }
    }

    drawMap();
    updateInfoBox();

    const existing = document.getElementById('infoBox').innerText;
    document.getElementById('infoBox').innerText =
        existing + `\n\n【匯入摘要】\n` +
        `模型: ${detectedModel}\n` +
        `座標: (${rMin},${cMin})..(${rMax},${cMax})\n` +
        `Pass: ${importedPass}, Fail: ${importedFail}\n` +
        `Edge: ${importedEdge}, 超範圍: ${outOfRange}`;
}

// ── Drag & Drop 支援 ─────────────────────────────────────
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) importZip(file);
});

// ── 匯出 zip ─────────────────────────────────────────────
function exportProductZip() {
    setStatus('正在打包…');
    const zip = new JSZip();

    zip.file('dieData.dat',  buildDieData());
    zip.file('devParm.dat',  buildDevParm());
    zip.file('devList.dat',  buildDevList());
    zip.file('videoData.dat', buildGenericData(0x40));
    zip.file('opParm.dat',    buildGenericData(0x50));

    zip.generateAsync({ type: 'blob' }).then(content => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = `Product_${config.modelType}_${config.flatAngle}deg.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setStatus('✅ 匯出完成');
    }).catch(e => setStatus('❌ ' + e.message));
}

// ── 初始化 ────────────────────────────────────────────────
window.onload = function() {
    initMapGrid();
    drawMap();
    updateInfoBox();
};
</script>
