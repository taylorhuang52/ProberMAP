<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prober MAP Editor v3.2 (支援邊緣偷 Die 功能版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #00d4ff;
            --border-color: #45475a;
            --pass-color: #00e676;
            --fail-color: #ff1744;
            --skip-color: #11111b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
        }
        .panel {
            width: 320px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        .canvas-container {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        canvas {
            border: 2px solid var(--border-color);
            background-color: #11111b;
            cursor: pointer;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 0.9rem; color: #a6adc8; font-weight: bold; }
        select, input, button {
            background-color: #1e1e2e;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        button {
            background-color: var(--accent-color);
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background-color: #00b4d8; }
        .info-box {
            background-color: #11111b;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            flex: 1;
        }
        .radio-tile-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #1e1e2e;
            font-size: 0.9rem;
        }
        .radio-label:hover {
            border-color: var(--accent-color);
        }
        .radio-label input {
            margin: 0;
            cursor: pointer;
        }
        .color-indicator {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            display: inline-block;
            border: 1px solid #fff;
        }
        #statusText {
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>Prober MAP Editor v3.2 (支援邊緣偷 Die 功能版)</h1>
    <div id="statusText">系統就緒</div>
</header>

<div class="main-container">
    <div class="panel">
        <div class="form-group">
            <label>探針台型號 (Model Type)</label>
            <select id="modelType" onchange="changeModel()">
                <option value="UF2000_ULLD">UF2000 / ULLD (51,968 bytes)</option>
                <option value="UF200_LLD">UF200 / M-LLD (38,400 bytes)</option>
            </select>
        </div>

        <div class="form-group">
            <label>平邊角度 (Flat Angle)</label>
            <input type="number" id="flatAngle" value="180" min="0" max="270" step="90" onchange="changeAngle()">
        </div>

        <div class="form-group">
            <label>滑鼠點擊編輯模式 (Edit Mode)</label>
            <div class="radio-tile-group">
                <label class="radio-label">
                    <input type="radio" name="editMode" value="pass" checked>
                    <span class="color-indicator" style="background-color: var(--pass-color);"></span>
                    <span>🟩 標記良品 / 要測試 (0x40)</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="editMode" value="fail">
                    <span class="color-indicator" style="background-color: var(--fail-color);"></span>
                    <span>🟥 標記不良品 / 要測試 (0x01)</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="editMode" value="skip">
                    <span class="color-indicator" style="background-color: #2d3142; border-color: #546e8a;"></span>
                    <span>⬛ 標記為不測試 (0x00 - Skip)</span>
                </label>
            </div>
        </div>

        <button onclick="resetMap()">重設地圖 (Reset Map)</button>
        <button onclick="exportProductZip()">下載產品包 (Export Product.zip)</button>

        <label style="margin-top:10px;">系統狀態與統計</label>
        <div id="infoBox" class="info-box"></div>
    </div>

    <div class="canvas-container">
        <canvas id="mapCanvas" width="448" height="448"></canvas>
    </div>
</div>

<script>
// ── 機台 Profile 定義 ──────────────────────────────────────
const PROFILES = {
    UF200_LLD:   { dataSize: 38400,  videoSize: 38400,  camFlag: 0x02, paddingByte: 0x50 },
    UF2000_ULLD: { dataSize: 51968,  videoSize: 51968,  camFlag: 0x04, paddingByte: 0x50 }
};

// ── 核心組態 ─────────────────────────────────────────────
let config = {
    modelType: 'UF2000_ULLD',
    rows: 32,
    cols: 32,
    flatAngle: 180
};

// ── 核心 Schema 映射對照 ──────────────────────────────────
const PARAM_SCHEMA = {
    UF200_LLD: [
        { id: 1, name: "DieRowSize",  type: "uint32", offset: 12, default: 4500 },
        { id: 2, name: "DieColSize",  type: "uint32", offset: 16, default: 4500 },
        { id: 3, name: "FlatAngle",   type: "uint16", offset: 30, default: 180  },
        { id: 4, name: "PassBinCode", type: "uint8",  offset: 32, default: 64   },
        { id: 5, name: "FailBinCode", type: "uint8",  offset: 33, default: 1    }
    ],
    UF2000_ULLD: [
        { id: 1, name: "DieRowSize",  type: "uint32", offset: 24, default: 4500 },
        { id: 2, name: "DieColSize",  type: "uint32", offset: 28, default: 4500 },
        { id: 3, name: "FlatAngle",   type: "uint16", offset: 42, default: 180  },
        { id: 4, name: "PassBinCode", type: "uint8",  offset: 44, default: 64   },
        { id: 5, name: "FailBinCode", type: "uint8",  offset: 45, default: 1    }
    ]
};

let mapGrid = [];
const cellSize = 14; 
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

// ── 晶圓初始化演算法 (6吋圓形收斂) ──────────────────────────
function initMapGrid() {
    mapGrid = [];
    const Cx = (config.cols - 1) / 2;
    const Cy = (config.rows - 1) / 2;
    const r_wafer = 15.2; 
    const edge_thickness = 1.2;

    for (let r = 0; r < config.rows; r++) {
        let rowData = [];
        for (let c = 0; c < config.cols; c++) {
            let dist = Math.sqrt(Math.pow(c - Cx, 2) + Math.pow(r - Cy, 2));
            let status = 'skip';

            if (dist <= (r_wafer - edge_thickness)) {
                status = 'active'; 
            } else if (dist <= r_wafer) {
                status = 'skip';   
            }

            rowData.push({
                status: status, // 'active' = 測試區, 'skip' = 外部不測試背景區
                fail: false     
            });
        }
        mapGrid.push(rowData);
    }
}

// ── 畫布繪製 (顏色區分優化) ──────────────────────────────────
function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < config.rows; r++) {
        for (let c = 0; c < config.cols; c++) {
            let cell = mapGrid[r][c];
            if (cell.status === 'skip') {
                ctx.fillStyle = '#11111b'; // 外部背景不測試區 (深黑色)
            } else {
                // 測試區：依照 Pass (綠色) 或 Fail (紅色) 呈現
                ctx.fillStyle = cell.fail ? 'rgba(255, 23, 68, 0.9)' : 'rgba(0, 230, 118, 0.9)'; 
            }
            ctx.fillRect(c * cellSize, r * cellSize, cellSize - 1, cellSize - 1);
        }
    }
}

// ── 滑鼠點擊編輯事件 (支援邊緣偷 Die 任意強制轉化功能) ─────────────
canvas.addEventListener('click', function(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const c = Math.floor(x / cellSize);
    const r = Math.floor(y / cellSize);

    if (r >= 0 && r < config.rows && c >= 0 && c < config.cols) {
        const selectedMode = document.querySelector('input[name="editMode"]:checked').value;
        let cell = mapGrid[r][c];

        if (selectedMode === 'skip') {
            // 強制關閉此晶粒：轉為不測試區 (Skip)
            cell.status = 'skip';
            cell.fail = false;
        } else if (selectedMode === 'fail') {
            // 偷 Edge Die / 正常標記：強制開通為測試區，且設定為不良品
            cell.status = 'active';
            cell.fail = true;
        } else {
            // 偷 Edge Die / 正常標記：強制開通為測試區，且設定為純良品
            cell.status = 'active';
            cell.fail = false;
        }

        drawMap();
        updateInfoBox();
    }
});

// ── UI 連動更新 ──────────────────────────────────────────
function changeModel() {
    config.modelType = document.getElementById('modelType').value;
    updateInfoBox();
}

function changeAngle() {
    config.flatAngle = parseInt(document.getElementById('flatAngle').value) || 0;
    updateInfoBox();
}

function resetMap() {
    initMapGrid();
    drawMap();
    updateInfoBox();
    document.getElementById('statusText').innerText = "地圖已重設";
}

function updateInfoBox() {
    let activeTotal = 0, passCount = 0, failCount = 0, skipCount = 0;
    
    mapGrid.forEach(row => row.forEach(cell => {
        if (cell.status === 'active') {
            activeTotal++;
            if (cell.fail) failCount++;
            else passCount++;
        } else {
            skipCount++;
        }
    }));

    const info = `【晶圓規格配置】\n` +
                 `探針台型號: ${config.modelType}\n` +
                 `矩陣大小: ${config.rows} x ${config.cols}\n` +
                 `平邊角度: ${config.flatAngle}°\n\n` +
                 `【目前晶粒統計】\n` +
                 `★總計測試 (Active): ${activeTotal} ea\n` +
                 `  └─ 良品 (Pass 0x40): ${passCount} ea\n` +
                 `  └─ 不良 (Fail 0x01): ${failCount} ea\n` +
                 `★總計不測 (Skip 0x00): ${skipCount} ea`;
    document.getElementById('infoBox').innerText = info;
}

// ── 二進位 16-bit 補碼校驗計算器 ───────────────────────────
function applyChecksum(buf) {
    let dv = new DataView(buf.buffer);
    let sum = 0;
    for (let i = 0; i < buf.length - 2; i++) {
        sum += buf[i];
    }
    let checksum = (0x10000 - (sum & 0xFFFF)) & 0xFFFF;
    dv.setUint16(buf.length - 2, checksum, false); 
}

// ── 封裝生成 dieData.dat (完美支援手動偷 Die 資料序列化) ───────────
function buildDieData() {
    const profile = PROFILES[config.modelType];
    const buf = new Uint8Array(profile.dataSize);
    const dv = new DataView(buf.buffer);

    // 寫入 64 位元組保留管理標頭
    buf[0] = 0x01; buf[1] = 0x00; buf[2] = 0x02; buf[3] = 0x00;
    dv.setUint16(4, config.rows, false);
    dv.setUint16(6, config.cols, false);

    // 行優先依序填入狀態代碼
    let offset = 64;
    for (let r = 0; r < config.rows; r++) {
        for (let c = 0; c < config.cols; c++) {
            let cell = mapGrid[r][c];
            if (cell.status === 'skip') {
                buf[offset] = 0x00; // 寫入 0x00，探針台硬體會自動跳過不測試
            } else {
                buf[offset] = cell.fail ? 0x01 : 0x40; // 寫入 0x40 或 0x01，探針台強行落針測試
            }
            offset++;
        }
    }

    applyChecksum(buf);
    return buf;
}

// ── 封裝生成 devParm.dat ─────────────────────────────────
function buildDevParm() {
    const profile = PROFILES[config.modelType];
    const buf = new Uint8Array(profile.dataSize);
    const dv = new DataView(buf.buffer);
    const schema = PARAM_SCHEMA[config.modelType];

    buf.fill(0x11, 0, 8);

    schema.forEach(p => {
        let val = p.default;
        if (p.name === "FlatAngle") val = config.flatAngle;

        if (p.type === "uint32") dv.setUint32(p.offset, val, false);
        else if (p.type === "uint16") dv.setUint16(p.offset, val, false);
        else if (p.type === "uint8") dv.setUint8(p.offset, val, false);
    });

    applyChecksum(buf);
    return buf;
}

// ── 封裝生成 devList.dat ─────────────────────────────────
function buildDevList() {
    const profile = PROFILES[config.modelType];
    const buf = new Uint8Array(profile.dataSize);
    const dv = new DataView(buf.buffer);
    const schema = PARAM_SCHEMA[config.modelType];

    let pid = 1;
    schema.forEach(p => {
        let off = 12 + (pid - 1) * 32;
        if (off + 32 > buf.length - 2) return;

        dv.setUint32(off, p.id, false);
        dv.setUint32(off + 4, p.offset, false);

        let typeCode = (p.type === "uint32") ? 0x04 : (p.type === "uint16" ? 0x02 : 0x01);
        dv.setUint8(off + 8, typeCode);
        pid++;
    });

    applyChecksum(buf);
    return buf;
}

// ── 封裝生成通用硬體對齊檔 (videoData & opParm) ──────────────────
function buildGenericData(fillByte) {
    const profile = PROFILES[config.modelType];
    const buf = new Uint8Array(profile.dataSize);
    
    buf[0] = 0x33; buf[1] = 0x2e; buf[2] = 0x30; buf[3] = 0x30; 
    buf[11] = profile.camFlag; 
    
    buf.fill(fillByte, 12, buf.length - 2);
    applyChecksum(buf);
    return buf;
}

// ── 下載與壓縮打包 ────────────────────────────────────────
function exportProductZip() {
    document.getElementById('statusText').innerText = "正在進行二進位打包...";
    const zip = new JSZip();

    zip.file("dieData.dat", buildDieData());
    zip.file("devParm.dat", buildDevParm());
    zip.file("devList.dat", buildDevList());
    zip.file("videoData.dat", buildGenericData(0x40)); 
    zip.file("opParm.dat", buildGenericData(0x50));    

    zip.generateAsync({ type: "blob" }).then((content) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = `Product_${config.modelType}_${config.flatAngle}deg.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        document.getElementById('statusText').innerText = "產品包下載完成！";
    }).catch(err => {
        document.getElementById('statusText').innerText = "錯誤: " + err.message;
    });
}

// ── 初始執行 ─────────────────────────────────────────────
window.onload = function() {
    initMapGrid();
    drawMap();
    updateInfoBox();
};
</script>

</body>
</html>
